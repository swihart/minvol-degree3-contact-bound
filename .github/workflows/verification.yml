name: Verification

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-verification:
    name: Exact certificate and Python audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify archived certificate checksums
        run: |
          cd certificate
          shasum -a 256 -c SHA256SUMS.txt

      - name: Run exact certificate and Python audits
        run: ./run_python_checks.sh

      - name: Recheck archived certificate checksums
        run: |
          cd certificate
          shasum -a 256 -c SHA256SUMS.txt

  r-verification:
    name: Independent base-R audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"

      - name: Run independent base-R audit
        run: ./run_r_checks.sh
